[project]
name = "i-hate-editing"
version = "0.1.0"
description = "Turn raw talking-head takes into a publishable video package"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
